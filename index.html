<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Pixel On The Grass</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <span id="coin-counter">Coins: 0/5</span>
    </div>

    <canvas id="gameCanvas" width="240" height="160"></canvas>

    <div id="overlay" class="hidden">
      <h1 id="overlay-title"></h1>
      <p id="overlay-message"></p>
      <button id="restart-button">Restart</button>
      <p class="hint">(or press R)</p>
    </div>
  </div>

  <p id="instructions">Move with the Arrow Keys. Avoid the red zones. Collect all 5 coins to win.</p>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/input.js"></script>
  <script src="js/mapGenerator.js"></script>
  <script src="js/player.js"></script>
  <script src="js/dangerZone.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
